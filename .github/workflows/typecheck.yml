name: typecheck

# Alerta de import quebrado (ex.: exportacao removida de src/lib/pocketbase/errors.ts).
# A build do Skip so roda "vite build" e nao confere tipos; este fluxo confere em todo push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit -p tsconfig.app.json
